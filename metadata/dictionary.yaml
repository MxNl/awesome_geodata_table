# Bilingual search dictionary (English / German).
#
# Each entry is one concept. A search term that belongs to a concept matches every
# row containing ANY term of that concept, so the English and German terms of a
# concept always give the same results. Words that are not in the dictionary are
# matched literally.
#
# Matching rules (see assets/agt.js, AGT_parseQuery):
#   - case, umlauts (ä = ae) and punctuation are ignored
#   - terms match at the start of a word ("grundwasser" finds "Grundwasserneubildung");
#     terms of up to 3 characters (ET, DEM, DWD) only match whole words
#   - a typed word that starts with a term of 6+ characters maps to that concept,
#     so inflections and compounds work ("Grundwasserstände" → groundwater level)
#   - a term may belong to one concept only (checked by the tests)
#   - `ignore` words are skipped (fillers like "und", "for", "Daten"), and a
#     `suffixes` ending is removed from unknown words ("Klimadaten" → "Klima")

- ignore: [and, or, for, of, the, in, on, at, by, with, to, from, a, an, about,
           data, dataset, datasets, information,
           und, oder, fuer, für, von, vom, zu, zum, zur, mit, im, am, auf, bei, aus, ueber, über,
           der, die, das, des, den, ein, eine, einer, eines, einem, einen,
           daten, datensatz, datensätze, information, informationen]
- suffixes: [daten, datensatz, datensätze, datensaetze, werte, informationen]

