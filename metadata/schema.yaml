# Schema of the Awesome Geodata Table metadata.
#
# datasets.csv   – one row per dataset
# parameters.csv – one row per parameter (variable) of a dataset. Any column that
#                  also exists in datasets.csv may be filled to override the
#                  dataset value for this parameter; leave it empty to inherit.
#                  Use the literal value `none` to override with "not applicable".
#                  `tags` are added to the dataset tags instead of replacing them.
#
# Field properties:
#   type:     string | integer | number | year | date | url | tags | vocab
#   vocab:    name of an entry under `vocabularies` (for type vocab)
#   required: must not be empty (after inheritance)
#   label:    column label in the table / detail view
#   help:     description used in the README and the contribution form
#
# Access snippets: metadata/snippets/<dataset id>.R and .py (optional).

# Bounding boxes [west, south, east, north] in degrees used for the study-area
# filter when a dataset has no bbox of its own.
regions:
  Global:        [-180, -90, 180, 90]
  Europe:        [-31.5, 27.5, 45.0, 71.5]
  Germany:       [5.87, 47.27, 15.04, 55.06]
  Africa:        [-25.4, -34.9, 63.5, 37.6]
  Asia:          [25.0, -11.0, 180.0, 81.9]
  North America: [-168.0, 7.0, -52.0, 83.7]
  South America: [-82.0, -56.0, -34.0, 13.0]
  Oceania:       [110.0, -48.0, 180.0, 0.0]

# One-click searches shown above the table. `query` uses the same syntax as a
# shared link (?…): filter columns or q/spatial/temporal/from/to/lat/lon,
# multiple values separated by "|".
presets:
  - label: Recharge modelling
    description: Climate forcing, evapotranspiration, soil and land surface data for groundwater recharge models
    query: variable=precipitation|air_temperature|evapotranspiration|potential_evapotranspiration|soil_moisture|groundwater_recharge|land_cover|soil_physics|soil_texture|elevation
  - label: Aquifer properties
    description: Permeability, porosity, aquifer maps, lithology and thickness of the subsurface
    query: variable=aquifer_properties|aquifer_units|lithology|subsurface_thickness|hydrologic_position
  - label: Climate forcing
    description: Gridded meteorological variables
    query: variable=precipitation|air_temperature|humidity|radiation|wind|potential_evapotranspiration&data_type=raster
  - label: ML predictors
    description: Gridded, mostly static environmental predictors for machine learning
    query: data_type=raster&variable=elevation|terrain_derivatives|drainage_network|hydrologic_position|lithology|subsurface_thickness|soil_texture|soil_physics|soil_chemistry|land_cover|aquifer_properties|climate_index
  - label: Groundwater monitoring
    description: Groundwater levels, storage, quality, abstraction and wells
    query: variable=groundwater_level|groundwater_monitoring|water_storage|groundwater_quality|groundwater_use|ground_deformation
  - label: Germany
    description: National datasets for Germany
    query: coverage_spatial=Germany

vocabularies:
  # Standard variables shared across datasets. Search synonyms (English and
  # German) live in metadata/dictionary.yaml.
  variable:
    # Climate
    - {key: precipitation, label: "Precipitation", group: Climate}
    - {key: air_temperature, label: "Air temperature", group: Climate}
    - {key: humidity, label: "Humidity & vapour pressure", group: Climate}
    - {key: radiation, label: "Radiation & energy fluxes", group: Climate}
    - {key: wind, label: "Wind", group: Climate}
    - {key: air_pressure, label: "Air pressure & geopotential", group: Climate}
    - {key: snow, label: "Snow", group: Climate}
    - {key: climate_index, label: "Climate & drought indices", group: Climate}
    # Water balance
    - {key: evapotranspiration, label: "Evapotranspiration", group: Water balance}
    - {key: potential_evapotranspiration, label: "Potential / reference evapotranspiration", group: Water balance}
    - {key: soil_moisture, label: "Soil moisture", group: Water balance}
    - {key: runoff, label: "Runoff", group: Water balance}
    - {key: river_discharge, label: "River discharge & streamflow", group: Water balance}
    - {key: water_storage, label: "Total water storage", group: Water balance}
    - {key: surface_water, label: "Surface water & lakes", group: Water balance}
    # Groundwater
    - {key: groundwater_level, label: "Groundwater level & water table depth", group: Groundwater}
    - {key: groundwater_recharge, label: "Groundwater recharge", group: Groundwater}
    - {key: groundwater_quality, label: "Groundwater quality", group: Groundwater}
    - {key: groundwater_use, label: "Groundwater abstraction & stress", group: Groundwater}
    - {key: aquifer_properties, label: "Aquifer properties", group: Groundwater}
    - {key: aquifer_units, label: "Aquifers & groundwater bodies", group: Groundwater}
    - {key: groundwater_monitoring, label: "Monitoring networks & wells", group: Groundwater}
    - {key: ground_deformation, label: "Ground deformation", group: Groundwater}
    - {key: groundwater_dependent_ecosystems, label: "Groundwater-dependent ecosystems", group: Groundwater}
    # Geology & soil
    - {key: lithology, label: "Lithology & geology", group: Geology & soil}
    - {key: subsurface_thickness, label: "Soil, regolith & sediment thickness", group: Geology & soil}
    - {key: soil_texture, label: "Soil texture", group: Geology & soil}
    - {key: soil_physics, label: "Soil physical & hydraulic properties", group: Geology & soil}
    - {key: soil_chemistry, label: "Soil chemistry & carbon", group: Geology & soil}
    - {key: soil_type, label: "Soil type & soil map units", group: Geology & soil}
    - {key: soil_temperature, label: "Soil temperature", group: Geology & soil}
    # Topography & hydrography
    - {key: elevation, label: "Elevation", group: Topography & hydrography}
    - {key: terrain_derivatives, label: "Terrain derivatives & landforms", group: Topography & hydrography}
    - {key: drainage_network, label: "Drainage network & flow routing", group: Topography & hydrography}
    - {key: hydrologic_position, label: "Hydrologic position", group: Topography & hydrography}
    # Land surface & human
    - {key: land_cover, label: "Land cover & land use", group: Land surface & human}
    - {key: vegetation, label: "Vegetation", group: Land surface & human}
    - {key: imperviousness, label: "Imperviousness & artificial surfaces", group: Land surface & human}
    - {key: irrigation, label: "Irrigation", group: Land surface & human}
    - {key: population, label: "Population & settlements", group: Land surface & human}
    - {key: pollution, label: "Pollution & pesticides", group: Land surface & human}
    - {key: catchment_attributes, label: "Catchment attributes", group: Land surface & human}
    - {key: other, label: "Other", group: Land surface & human}
  license_class:
    - open
    - non-commercial
    - custom terms
    - unknown
  domain:
    - Climate & atmosphere
    - Hydrology
    - Hydrogeology
    - Soil
    - Geology
    - Topography
    - Land cover & land use
    - Vegetation & ecology
    - Agriculture & water use
    - Water quality & pollution
    - Human & socio-economic
  # ordered from fine to coarse: hourly = ≤ 1 h, daily = ≤ 1 d, weekly = ≤ 7 d,
  # monthly = ≤ 1 month, yearly = ≤ 1 a, decadal = ≤ 10 a, multi-decadal = > 10 a;
  # `static` = no temporal dimension
  temporal_resolution:
    - {key: hourly,       label: "hourly"}
    - {key: daily,        label: "daily"}
    - {key: weekly,       label: "weekly"}
    - {key: monthly,      label: "monthly"}
    - {key: yearly,       label: "yearly"}
    - {key: decadal,      label: "decadal"}
    - {key: multidecadal, label: "multi-decadal"}
    - {key: static,       label: "static"}
  coverage_spatial:
    - Global
    - Europe
    - Germany
    - Africa
    - Asia
    - North America
    - South America
    - Oceania
  data_type:
    - raster
    - vector
    - point
    - tabular
  temporal_type:
    - dynamic
    - aggregated-dynamic
    - semi-static
    - static
  vertical:
    - atmosphere
    - land surface
    - shallow subsurface
    - subsurface
    - multiple
  access:
    - open
    - registration
    - on request
    - restricted
  method:
    - observation-based
    - model-based
    - hybrid
  processing_level:
    - raw
    - preprocessing needed
    - final product
  maintained:
    - "yes"
    - "no"
    - unknown

datasets:
  id:                     {type: string, required: true, label: "ID", help: "Unique lower-case slug, e.g. era5-land"}
  name:                   {type: string, required: true, label: "Dataset", help: "Full name with optional abbreviation in brackets"}
  domain:                 {type: vocab, vocab: domain, required: true, label: "Domain"}
  tags:                   {type: tags, label: "Tags", help: "Lower-case keywords separated by ';'"}
  publisher:              {type: string, label: "Publisher"}
  coverage_spatial:       {type: vocab, vocab: coverage_spatial, required: true, label: "Spatial coverage"}
  data_type:              {type: vocab, vocab: data_type, label: "Data type"}
  format:                 {type: string, label: "Format", help: "File formats, e.g. GeoTIFF; netCDF"}
  crs:                    {type: string, label: "CRS", help: "Coordinate reference system, preferably as EPSG code"}
  res_spatial_finest_m:   {type: number, label: "Spatial res. finest [m]", help: "Finest available spatial resolution in metres (approx. at the equator for geographic grids)"}
  res_spatial_coarsest_m: {type: number, label: "Spatial res. coarsest [m]", help: "Coarsest available spatial resolution in metres"}
  res_spatial_note:       {type: string, label: "Spatial res. (original)", help: "Resolution in original notation, e.g. 0.1°, 30 arc-sec, 1:1 million"}
  res_temporal_finest:    {type: vocab, vocab: temporal_resolution, label: "Temporal res. finest"}
  res_temporal_coarsest:  {type: vocab, vocab: temporal_resolution, label: "Temporal res. coarsest"}
  coverage_start:         {type: year, label: "Coverage start", help: "First year covered"}
  coverage_end:           {type: year, label: "Coverage end", help: "Last year covered, or 'present' if ongoing"}
  temporal_type:          {type: vocab, vocab: temporal_type, label: "Temporal type"}
  vertical:               {type: vocab, vocab: vertical, label: "Vertical position"}
  maintained:             {type: vocab, vocab: maintained, label: "Updated regularly"}
  latency:                {type: string, label: "Update latency", help: "Delay between observation and publication, e.g. 5 d, 3 months"}
  published:              {type: year, label: "First published"}
  method:                 {type: vocab, vocab: method, label: "Method"}
  processing_level:       {type: vocab, vocab: processing_level, label: "Processing level"}
  access:                 {type: vocab, vocab: access, required: true, label: "Access"}
  access_method:          {type: string, label: "Access method", help: "e.g. download; API; WMS; Google Earth Engine"}
  license:                {type: string, label: "License"}
  license_class:          {type: vocab, vocab: license_class, label: "License class", help: "open = any use incl. commercial (with attribution); non-commercial; custom terms = read the provider terms"}
  download_url:           {type: url, required: true, label: "Download"}
  doc_url:                {type: url, label: "Documentation / literature"}
  doi:                    {type: string, label: "DOI", help: "DOI of the dataset or its describing publication, e.g. 10.5194/essd-13-4349-2021"}
  quality_notes:          {type: string, label: "Limitations"}
  comment:                {type: string, label: "Comment"}
  bbox_west:              {type: number, label: "West", help: "Bounding box in degrees; leave empty to use the box of coverage_spatial (see regions)"}
  bbox_south:             {type: number, label: "South"}
  bbox_east:              {type: number, label: "East"}
  bbox_north:             {type: number, label: "North"}
  last_verified:          {type: date, label: "Last verified", help: "Date (YYYY-MM-DD) the entry was last checked against the provider page"}

parameters:
  dataset_id:             {type: string, required: true, label: "Dataset ID"}
  parameter:              {type: string, required: true, label: "Parameter"}
  unit:                   {type: string, label: "Unit", help: "Plain-text unit, e.g. kg/m³, mm/a, %, categorical"}
  variable:               {type: vocab, vocab: variable, label: "Variable", help: "Standard variable from the `variable` vocabulary"}
