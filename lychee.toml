# Configuration of the weekly link check (.github/workflows/link-check.yaml).
# For a closer look use the real-browser audit: node tests/e2e/linkcheck.js

# be gentle with data portals
max_concurrency = 4
max_retries = 3
retry_wait_time = 10
timeout = 30
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

# 403: publishers and Zenodo block automated requests, the links work in browsers
# 429: rate limiting
accept = ["200..=299", "403", "429"]

exclude = [
  # resets automated connections; checked manually
  "^https://gdk\\.gdi-de\\.org/",
  # IOP Publishing: cookie redirect loop for non-browsers
  "^https://doi\\.org/10\\.1088/",
  # templates and placeholders in snippets
  "%s",
  "%d",
  "\\{",
  "%7B",
  "<your-",
]
